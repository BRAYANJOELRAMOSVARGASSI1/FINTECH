services:
  # Backend API (Python/FastAPI)
  - type: web
    name: finengine-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finengine-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "[\"*\"]"
      - key: PYTHON_VERSION
        value: 3.11.0

  # Frontend Web App (Next.js)
  - type: web
    name: finengine-frontend
    env: node
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: finengine-backend
          property: url
      - key: NODE_VERSION
        value: 20.x

databases:
  # Managed PostgreSQL Base de Datos
  - name: finengine-db
    databaseName: finengine
    user: finengine_user
    plan: free
